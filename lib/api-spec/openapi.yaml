openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Smart Ombor and MoySklad Remap integration API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: account
  - name: moysklad
  - name: inventory
  - name: documents
  - name: analytics
  - name: operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getCurrentUser
      tags: [account]
      summary: Get the signed-in user's app role
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
  /users:
    get:
      operationId: listUsers
      tags: [account]
      summary: List staff and roles
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppUser"
  /users/{id}/role:
    patch:
      operationId: updateUserRole
      tags: [account]
      summary: Change a staff member's role
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleUpdate"
      responses:
        "200":
          description: Updated staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
  /moysklad/status:
    get:
      operationId: getMoyskladStatus
      tags: [moysklad]
      summary: Check MoySklad API configuration and connection
      responses:
        "200":
          description: Integration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationStatus"
  /moysklad/sync:
    post:
      operationId: syncMoysklad
      tags: [moysklad]
      summary: Synchronize products, warehouses, stock and documents
      responses:
        "200":
          description: Synchronization result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRun"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [analytics]
      summary: Get live warehouse and sales summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /warehouses:
    get:
      operationId: listWarehouses
      tags: [inventory]
      summary: List MoySklad warehouses
      responses:
        "200":
          description: Warehouses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Warehouse"
  /products:
    get:
      operationId: listProducts
      tags: [inventory]
      summary: Search and filter products with current stock
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: warehouseId
          schema: { type: string }
        - in: query
          name: factory
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: stockStatus
          schema: { type: string, enum: [all, low, available, out] }
        - in: query
          name: idleDays
          schema: { type: integer, enum: [7, 15, 25, 30, 60, 90] }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Product page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
  /products/resolve:
    get:
      operationId: resolveScan
      tags: [inventory]
      summary: Match a barcode or the model numbers printed beside it
      parameters:
        - in: query
          name: code
          schema: { type: string }
        - in: query
          name: text
          schema: { type: string }
      responses:
        "200":
          description: Scan match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarcodeLookup"
  /products/barcode/{barcode}:
    get:
      operationId: lookupBarcode
      tags: [inventory]
      summary: Resolve a barcode without guessing when matches are ambiguous
      parameters:
        - in: path
          name: barcode
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Barcode matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarcodeLookup"
  /stock:
    get:
      operationId: listStock
      tags: [inventory]
      summary: Get per-warehouse balances and in-transit quantities
      parameters:
        - in: query
          name: warehouseId
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Stock page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockPage"
  /analytics/sales:
    get:
      operationId: getSalesAnalytics
      tags: [analytics]
      summary: Sales totals and trends for a selected period
      parameters:
        - in: query
          name: period
          schema: { type: string, enum: [7d, 30d, 90d, 365d], default: 30d }
        - in: query
          name: warehouseId
          schema: { type: string }
      responses:
        "200":
          description: Sales analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesAnalytics"
  /analytics/non-moving:
    get:
      operationId: getNonMovingProducts
      tags: [analytics]
      summary: Find products with no sale in the selected period
      parameters:
        - in: query
          name: days
          schema: { type: integer, enum: [7, 15, 25, 30, 60, 90], default: 25 }
        - in: query
          name: warehouseId
          schema: { type: string }
      responses:
        "200":
          description: Non-moving products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /analytics/recommendations:
    get:
      operationId: getPurchaseRecommendations
      tags: [analytics]
      summary: Calculate reorder suggestions from sales velocity and on-hand stock
      parameters:
        - in: query
          name: warehouseId
          schema: { type: string }
      responses:
        "200":
          description: Reorder recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recommendation"
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List recent receipts, transfers and inventory sessions
      parameters:
        - in: query
          name: kind
          schema: { type: string, enum: [all, receipt, transfer, inventory] }
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentSummary"
  /receipts:
    post:
      operationId: createReceipt
      tags: [documents]
      summary: Save an inbound receipt draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptInput"
      responses:
        "201":
          description: Draft receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
  /receipts/{id}/confirm:
    post:
      operationId: confirmReceipt
      tags: [documents]
      summary: Create and verify a MoySklad goods receipt
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Confirmed receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
  /transfers:
    post:
      operationId: createTransfer
      tags: [documents]
      summary: Create an inter-warehouse transfer draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferInput"
      responses:
        "201":
          description: Transfer draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
  /transfers/{id}/dispatch:
    post:
      operationId: dispatchTransfer
      tags: [documents]
      summary: Record dispatch and create the MoySklad transfer document
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Dispatched transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
  /transfers/{id}/receive:
    post:
      operationId: receiveTransfer
      tags: [documents]
      summary: Record scanned quantities at the receiving warehouse
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferReceiveInput"
      responses:
        "200":
          description: Updated transfer receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
  /inventories:
    post:
      operationId: createInventory
      tags: [documents]
      summary: Start a barcode inventory session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryInput"
      responses:
        "201":
          description: Inventory session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySession"
  /inventories/{id}/count:
    post:
      operationId: countInventoryItem
      tags: [documents]
      summary: Add or update a scanned product count
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryCountInput"
      responses:
        "200":
          description: Updated inventory session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySession"
  /inventories/{id}/confirm:
    post:
      operationId: confirmInventory
      tags: [documents]
      summary: Apply an approved inventory adjustment in MoySklad
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Confirmed inventory session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySession"
  /tasks:
    get:
      operationId: listTasks
      tags: [operations]
      summary: List staff tasks
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [all, open, in_progress, done] }
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [operations]
      summary: Create a staff task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [operations]
      summary: Update a task status, assignment or notes
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /audit:
    get:
      operationId: listAuditEvents
      tags: [operations]
      summary: Read recent operational audit events
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    AppUser:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role:
          type: string
          enum: [super_admin, manager, warehouse_manager, warehouse_staff, branch_manager, analyst]
    UserRoleUpdate:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [super_admin, manager, warehouse_manager, warehouse_staff, branch_manager, analyst]
    IntegrationStatus:
      type: object
      required: [configured, connected, lastSync, error]
      properties:
        configured: { type: boolean }
        connected: { type: boolean }
        companyName: { type: ["string", "null"] }
        lastSync: { type: ["string", "null"], format: date-time }
        error: { type: ["string", "null"] }
    SyncRun:
      type: object
      required: [id, status, startedAt, finishedAt, productCount, warehouseCount, error]
      properties:
        id: { type: string }
        status: { type: string, enum: [running, completed, failed] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: ["string", "null"], format: date-time }
        productCount: { type: integer }
        warehouseCount: { type: integer }
        error: { type: ["string", "null"] }
    DashboardSummary:
      type: object
      required: [productCount, stockUnits, stockValue, lowStockCount, nonMovingCount, expiringCount, pendingTransfers, salesToday, incomingToday, lastSync]
      properties:
        productCount: { type: integer }
        stockUnits: { type: number }
        stockValue: { type: ["number", "null"] }
        lowStockCount: { type: integer }
        nonMovingCount: { type: integer }
        expiringCount: { type: integer }
        pendingTransfers: { type: integer }
        salesToday: { type: number }
        incomingToday: { type: number }
        lastSync: { type: ["string", "null"], format: date-time }
    Warehouse:
      type: object
      required: [id, name, code, address]
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
    Product:
      type: object
      required: [id, name, code, article, barcodes, factory, category, unit, packType, packSize, imageUrl, stock, available, cost, salePrice, lastSale, lastReceipt, sales7, sales30, sales60, sales90, daysCover, stockStatus]
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: ["string", "null"] }
        article: { type: ["string", "null"] }
        barcodes:
          type: array
          items: { type: string }
        factory: { type: ["string", "null"] }
        category: { type: ["string", "null"] }
        unit: { type: ["string", "null"] }
        packType: { type: ["string", "null"] }
        packSize: { type: number }
        imageUrl: { type: ["string", "null"] }
        stock: { type: number }
        available: { type: number }
        cost: { type: ["number", "null"] }
        salePrice: { type: ["number", "null"] }
        lastSale: { type: ["string", "null"], format: date-time }
        lastReceipt: { type: ["string", "null"], format: date-time }
        sales7: { type: number }
        sales30: { type: number }
        sales60: { type: number }
        sales90: { type: number }
        daysCover: { type: ["number", "null"] }
        stockStatus: { type: string, enum: [healthy, low, out, non_moving] }
    ProductPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    BarcodeLookup:
      type: object
      required: [barcode, ambiguous, products]
      properties:
        barcode: { type: string }
        ambiguous: { type: boolean }
        products:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        locations:
          type: array
          items:
            type: object
            required: [productId, warehouseName, quantity, inTransit]
            properties:
              productId: { type: string }
              warehouseName: { type: string }
              quantity: { type: number }
              inTransit: { type: number }
    StockRow:
      type: object
      required: [product, warehouse, quantity, inTransit, value]
      properties:
        product: { $ref: "#/components/schemas/Product" }
        warehouse: { $ref: "#/components/schemas/Warehouse" }
        quantity: { type: number }
        inTransit: { type: number }
        value: { type: ["number", "null"] }
    StockPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StockRow" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    SalesPoint:
      type: object
      required: [date, amount, quantity]
      properties:
        date: { type: string }
        amount: { type: number }
        quantity: { type: number }
    SalesAnalytics:
      type: object
      required: [period, totalAmount, totalQuantity, averagePerDay, trend, topProducts]
      properties:
        period: { type: string }
        totalAmount: { type: number }
        totalQuantity: { type: number }
        averagePerDay: { type: number }
        trend:
          type: array
          items: { $ref: "#/components/schemas/SalesPoint" }
        topProducts:
          type: array
          items: { $ref: "#/components/schemas/Product" }
    Recommendation:
      type: object
      required: [product, warehouseId, dailyAverage, leadTimeDays, safetyStock, onHand, inTransit, suggestedQuantity, reason]
      properties:
        product: { $ref: "#/components/schemas/Product" }
        warehouseId: { type: string }
        dailyAverage: { type: number }
        leadTimeDays: { type: number }
        safetyStock: { type: number }
        onHand: { type: number }
        inTransit: { type: number }
        suggestedQuantity: { type: number }
        reason: { type: string }
    DocumentSummary:
      type: object
      required: [id, kind, number, date, status, sourceWarehouse, targetWarehouse, itemCount, moyskladId]
      properties:
        id: { type: string }
        kind: { type: string, enum: [receipt, transfer, inventory] }
        number: { type: string }
        date: { type: string, format: date-time }
        status: { type: string }
        sourceWarehouse: { type: ["string", "null"] }
        targetWarehouse: { type: ["string", "null"] }
        itemCount: { type: integer }
        moyskladId: { type: ["string", "null"] }
    DocumentLineInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string }
        quantity: { type: number, exclusiveMinimum: 0 }
        receivedQuantity: { type: ["number", "null"], minimum: 0 }
        price: { type: ["number", "null"], minimum: 0 }
        batch: { type: ["string", "null"] }
        expiryDate: { type: ["string", "null"], format: date }
    ReceiptInput:
      type: object
      required: [warehouseId, date, lines]
      properties:
        warehouseId: { type: string }
        supplierId: { type: ["string", "null"] }
        date: { type: string, format: date-time }
        comment: { type: ["string", "null"] }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/DocumentLineInput" }
    Receipt:
      type: object
      required: [id, number, status, date, warehouseId, supplierId, comment, lines, moyskladId]
      properties:
        id: { type: string }
        number: { type: string }
        status: { type: string, enum: [draft, confirmed, cancelled, sync_error] }
        date: { type: string, format: date-time }
        warehouseId: { type: string }
        supplierId: { type: ["string", "null"] }
        comment: { type: ["string", "null"] }
        lines:
          type: array
          items: { $ref: "#/components/schemas/DocumentLineInput" }
        moyskladId: { type: ["string", "null"] }
    TransferInput:
      type: object
      required: [sourceWarehouseId, targetWarehouseId, comment, lines]
      properties:
        sourceWarehouseId: { type: string }
        targetWarehouseId: { type: string }
        comment: { type: ["string", "null"] }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/DocumentLineInput" }
    TransferReceiveLine:
      type: object
      required: [productId, receivedQuantity]
      properties:
        productId: { type: string }
        receivedQuantity: { type: number, minimum: 0 }
    TransferReceiveInput:
      type: object
      required: [lines, comment]
      properties:
        lines:
          type: array
          items: { $ref: "#/components/schemas/TransferReceiveLine" }
        comment: { type: ["string", "null"] }
    Transfer:
      type: object
      required: [id, number, status, createdAt, sourceWarehouseId, targetWarehouseId, comment, lines, moyskladId]
      properties:
        id: { type: string }
        number: { type: string }
        status:
          type: string
          enum: [draft, ready, dispatched, in_transit, partially_received, received, discrepancy, cancelled, sync_error]
        createdAt: { type: string, format: date-time }
        sourceWarehouseId: { type: string }
        targetWarehouseId: { type: string }
        comment: { type: ["string", "null"] }
        lines:
          type: array
          items: { $ref: "#/components/schemas/DocumentLineInput" }
        moyskladId: { type: ["string", "null"] }
    InventoryInput:
      type: object
      required: [warehouseId, comment]
      properties:
        warehouseId: { type: string }
        comment: { type: ["string", "null"] }
    InventoryCountInput:
      type: object
      required: [barcode, productId, quantity]
      properties:
        barcode: { type: string }
        productId: { type: string }
        quantity: { type: number, minimum: 0 }
    InventoryLine:
      type: object
      required: [product, systemQuantity, countedQuantity, difference]
      properties:
        product: { $ref: "#/components/schemas/Product" }
        systemQuantity: { type: number }
        countedQuantity: { type: number }
        difference: { type: number }
    InventorySession:
      type: object
      required: [id, number, status, warehouseId, createdAt, lines, moyskladId]
      properties:
        id: { type: string }
        number: { type: string }
        status: { type: string, enum: [counting, pending_approval, confirmed, sync_error] }
        warehouseId: { type: string }
        createdAt: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: "#/components/schemas/InventoryLine" }
        moyskladId: { type: ["string", "null"] }
    TaskInput:
      type: object
      required: [title, description, assignedTo, dueDate, priority]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        assignedTo: { type: ["string", "null"] }
        dueDate: { type: ["string", "null"], format: date }
        priority: { type: string, enum: [low, normal, high, urgent] }
    TaskUpdate:
      type: object
      properties:
        status: { type: string, enum: [open, in_progress, done] }
        assignedTo: { type: ["string", "null"] }
        dueDate: { type: ["string", "null"], format: date }
        description: { type: ["string", "null"] }
    Task:
      allOf:
        - $ref: "#/components/schemas/TaskInput"
        - type: object
          required: [id, status, createdAt, source]
          properties:
            id: { type: string }
            status: { type: string, enum: [open, in_progress, done] }
            createdAt: { type: string, format: date-time }
            source: { type: ["string", "null"] }
    AuditEvent:
      type: object
      required: [id, action, entityType, entityId, actor, createdAt, details]
      properties:
        id: { type: string }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: ["string", "null"] }
        actor: { type: string }
